[package]
name = "knu_diagnosis_setup"
version = "0.1.0"
edition = "2021"
authors = ["Kangwon National University"]
description = "Interactive Windows Installer for KNU Diagnosis (Kangwon National University)"
license = "MIT"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
